<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorBridgeHK — Post詳情</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- 一般瀏覽器 -->
    <link rel="icon" type="image/png" sizes="32x32" href="tutorbridgehkicon3.png">
    <link rel="icon" type="image/png" sizes="16x16" href="tutorbridgehkicon3.png">
    <!-- Apple 裝置 -->
    <link rel="apple-touch-icon" sizes="180x180" href="tutorbridgehkicon3.png">
    <!-- Android 裝置 -->
    <link rel="manifest" href="tutorbridgehkicon3.png">
    <!-- 内联脚本：立即设置导航栏状态，防止闪烁 -->
    <script>
        (function() {
            try {
                const storedProfile = localStorage.getItem('tutorbridge_profile');
                if (storedProfile) {
                    const profile = JSON.parse(storedProfile);
                    // 创建临时样式来立即隐藏默认导航栏，显示用户菜单
                    const style = document.createElement('style');
                    style.id = 'nav-state-style';
                    style.textContent = '#authButtons { display: none !important; } #userMenu { display: flex !important; }';
                    document.head.appendChild(style);
                    
                    // 设置问候语的内容，等DOM加载后
                    document.addEventListener('DOMContentLoaded', function() {
                        const userGreeting = document.getElementById('userGreeting');
                        if (userGreeting) {
                            userGreeting.textContent = '你好, ' + (profile.name || '用戶');
                        }
                    });
                }
            } catch(e) {
                console.error('恢复导航栏状态失败:', e);
            }
        })();
    </script>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <img src = "tutorbridgehkicon3.png" alt="思橋 TutorBridgeHK" style="height: 60px; width: auto;">
                    TutorBridgeHK
                </a>
                <nav class="nav-links">
                    <div id="authButtons" style="display:flex; gap:24px; align-items:center;">
                        <a class="nav-link" href="index.html">首頁</a>
                        <a class="btn btn-secondary btn-small" href="auth.html">登入/註冊</a>
                    </div>
                    <div id="userMenu" class="user-menu" style="display:none; gap:24px; align-items:center;">
                        <span class="user-greeting" id="userGreeting"></span>
                        <a class="nav-link" href="index.html">首頁</a>
                        <a class="nav-link" href="match.html">📋 配對列表</a>
                        <a class="nav-link" href="post.html">發布Post</a>
                        <a class="nav-link" href="messages.html">訊息</a>
                        <a class="nav-link" href="profile.html">個人檔案</a>
                        <button class="btn btn-logout btn-small" onclick="logout()">登出</button>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>TutorBridgeHK — 免中介費補習配對平台</h1>
            <p class="hero-subtitle">學生導師 · 免費配對 · 不收中介費</p>
        </div>
    </section>

    <main class="main-content">
        <div class="container">
            <button class="btn btn-secondary btn-small" onclick="window.location.href='match.html'">← 返回配對列表</button>
            <div id="postDetailContent" class="post-detail" style="margin-top:16px;">
                <div class="empty-state">載入中...</div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                © 2024 TutorBridgeHK. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Modals -->
    <div id="deletePostModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">確認刪除</h3>
                <button class="modal-close" onclick="closeModal('deletePostModal')">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 24px;">確定要刪除此 Post 嗎？此動作無法復原。</p>
                <div style="display: flex; gap: 12px;">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeModal('deletePostModal')">取消</button>
                    <button type="button" class="btn btn-danger" style="flex: 1;" onclick="confirmDeletePost()">確認刪除</button>
                </div>
            </div>
        </div>
    </div>

    <div id="reportModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">舉報</h3>
                <button class="modal-close" onclick="closeModal('reportModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="reportForm" onsubmit="handleReport(event)">
                    <div class="form-group">
                        <label>舉報原因</label>
                        <textarea class="form-control" id="reportReason" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-danger" style="width:100%;">提交舉報</button>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 從URL獲取Post ID
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            
            if (postId) {
                // 創建載入Post詳情的函數
                const loadPostDetail = async (pid) => {
                    selectedPostId = pid;
                    const content = document.getElementById('postDetailContent');
                    if (!content) return;
                    content.innerHTML = '<div class="empty-state">載入中...</div>';
                    
                    try {
                        const { data: post, error } = await supabase
                            .from('posts')
                            .select(`
                                *,
                                author: user_id (user_code, name, district, sub_district)
                            `)
                            .eq('id', pid)
                            .single();
                        
                        if (error) throw error;
                        
                        const isOwner = currentUser?.id === post.user_id;
                        const locationDisplay = (post.districts || []).join(', ') || post.district || '';
                        const authorUserCode = post.author?.user_code || '未知';
                        const authorName = post.author?.name || '匿名';
                        
                        // 檢查申請資格
                        let canApply = false;
                        let applyRestrictionMessage = '';
                        if (currentUser && !isOwner && currentProfile) {
                            if (post.type === 'tutor_wanted' && currentProfile.role === 'tutor') {
                                canApply = true; // 學生個案 - 只有導師可以申請
                            } else if (post.type === 'student_wanted' && currentProfile.role === 'student') {
                                canApply = true; // 導師列表 - 只有學生可以申請
                            } else {
                                if (post.type === 'tutor_wanted') {
                                    applyRestrictionMessage = '只有導師可以申請此學生個案';
                                } else {
                                    applyRestrictionMessage = '只有學生可以申請此導師';
                                }
                            }
                        }
                        
                        let teachingModeLabel = '';
                        if (post.teaching_mode === '視像補習') {
                            teachingModeLabel = '💻 視像補習';
                        } else if (post.teaching_mode === '面對面授課') {
                            teachingModeLabel = '🏫 面對面授課';
                        } else if (post.teaching_mode === '兩者皆可') {
                            teachingModeLabel = '💻🏫 兩者皆可';
                        }
                        
                        content.innerHTML = `
                            <div class="detail-header">
                                <div class="post-header" style="margin-bottom: 16px;">
                                    <h1 class="detail-title">${escapeHtml(post.title || '無標題')}</h1>
                                    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                                        <span class="post-tag ${post.type === 'tutor_wanted' ? 'tag-tutor' : 'tag-student'}">
                                            ${post.type === 'tutor_wanted' ? '📚 學生個案' : '🎓 導師列表'}
                                        </span>
                                        <span class="post-tag tag-subject">${escapeHtml(post.subject || '其他')}</span>
                                        ${teachingModeLabel ? `<span class="post-tag tag-subject">${teachingModeLabel}</span>` : ''}
                                    </div>
                                </div>
                                <div class="detail-meta">
                                    ${post.post_code ? `<span class="meta-item">🏷️ ${escapeHtml(post.post_code)}</span>` : ''}
                                    ${locationDisplay ? `<span class="meta-item">📍 ${escapeHtml(locationDisplay)}</span>` : ''}
                                    ${post.budget_or_rate ? `<span class="meta-item">💰 $${post.budget_or_rate}/hr</span>` : ''}
                                    <span class="meta-item">👤 發布者: ${authorUserCode}</span>
                                    <span class="meta-item">🕒 ${formatDate(post.created_at)}</span>
                                </div>
                            </div>
                            <div class="post-description" style="font-size: 16px; line-height: 1.8; margin-bottom: 24px;">
                                ${escapeHtml(post.description || '')}
                            </div>
                            ${post.qualification ? `<p style="margin-bottom: 16px;"><strong>學歷/要求:</strong> ${escapeHtml(post.qualification)}</p>` : ''}
                            ${post.teaching_experience ? `<p style="margin-bottom: 24px;"><strong>教學經驗:</strong> ${escapeHtml(post.teaching_experience)}</p>` : ''}
                            
                            <div class="disclaimer">
                                此Post由用戶自行發布，平台不收取任何中介費。請用戶自行判斷導師適合性。
                            </div>
                            
                            <div style="display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap;">
                                <button class="btn btn-secondary" onclick="window.location.href='match.html'">← 返回</button>
                                ${isOwner ? `<button class="btn btn-danger" onclick="openDeletePostModal('${post.id}')">🗑️ 刪除</button>` : ''}
                                ${canApply ? `<button class="btn btn-primary" onclick="openWhatsAppApplication('${post.id}')">📱 透過 WhatsApp 申請</button>` : ''}
                                ${!isOwner && !canApply && applyRestrictionMessage ? `<span style="color: var(--danger-color); padding: 10px 0;">${escapeHtml(applyRestrictionMessage)}</span>` : ''}
                                ${!isOwner ? `<button class="btn btn-secondary" onclick="openReportModal('post', '${post.id}')">舉報</button>` : ''}
                            </div>
                        `;
                        
                    } catch (error) {
                        console.error('❌ 載入Post詳情失敗:', error);
                        content.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">⚠️</div>
                                <h3>載入失敗</h3>
                                <p>${error.message}</p>
                            </div>
                        `;
                    }
                };
                loadPostDetail(postId);
            }
        });
    </script>
</body>
</html>
