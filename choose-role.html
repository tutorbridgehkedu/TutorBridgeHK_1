<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選擇身份 - TutorBridgeHK</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="tutorbridgehkicon3.png">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .role-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .role-container h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .role-container p {
            color: #666;
            margin-bottom: 30px;
        }
        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .role-btn {
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .role-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
        }
        .role-btn.student {
            color: #667eea;
        }
        .role-btn.tutor {
            color: #764ba2;
        }
        .role-icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }
        .loading {
            display: none;
            margin-top: 20px;
            color: #666;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="role-container">
        <h1>歡迎加入 TutorBridgeHK</h1>
        <p>請選擇您的身份</p>
        
        <div class="role-buttons">
            <button class="role-btn student" onclick="selectRole('student')">
                <span class="role-icon">📚</span>
                我是學生
                <div style="font-size: 14px; font-weight: normal; color: #666; margin-top: 4px;">尋找導師</div>
            </button>
            
            <button class="role-btn tutor" onclick="selectRole('tutor')">
                <span class="role-icon">🎓</span>
                我是導師
                <div style="font-size: 14px; font-weight: normal; color: #666; margin-top: 4px;">提供補習服務</div>
            </button>
        </div>
        
        <div class="loading" id="loading">
            <span class="spinner"></span>
            正在建立帳戶...
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const SUPABASE_URL = 'https://aweqbxyjeohsnevnkwor.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1tMcgJ9Gv5vfi-pKrPqOTA_BdhZqPoM';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function selectRole(role) {
            const loading = document.getElementById('loading');
            const buttons = document.querySelectorAll('.role-btn');
            
            loading.style.display = 'block';
            buttons.forEach(btn => btn.disabled = true);

            try {
                // 獲取當前 session
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                
                if (sessionError) throw sessionError;
                
                if (!session) {
                    console.error('❌ 沒有找到 session');
                    showToast('登入失敗，請重新登入', 'error');
                    setTimeout(() => {
                        window.location.href = 'auth.html';
                    }, 2000);
                    return;
                }

                console.log('✅ 找到 session:', session.user);
                
                // 生成 user_code
                const prefix = role === 'student' ? 'S' : 'T';
                let userCode = '';
                
                try {
                    // 獲取計數器
                    const { data: counterData, error: counterError } = await supabase
                        .from('counter')
                        .select('current_value')
                        .eq('id', role)
                        .single();
                    
                    if (counterError) throw counterError;
                    
                    const nextValue = (counterData.current_value || 0) + 1;
                    userCode = prefix + String(nextValue).padStart(4, '0');
                    
                    // 更新計數器
                    const { error: updateCounterError } = await supabase
                        .from('counter')
                        .update({ current_value: nextValue })
                        .eq('id', role);
                    
                    if (updateCounterError) throw updateCounterError;
                    
                } catch (error) {
                    console.error('❌ 生成 user_code 失敗:', error);
                    userCode = prefix + '0001'; // 預設值
                }

                // 建立 profile
                const profileData = {
                    id: session.user.id,
                    email: session.user.email,
                    name: session.user.user_metadata?.full_name || session.user.user_metadata?.name || session.user.email?.split('@')[0] || '用戶',
                    role: role,
                    user_code: userCode,
                    created_at: new Date().toISOString()
                };

                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .insert([profileData])
                    .select()
                    .single();

                if (profileError) throw profileError;

                console.log('✅ Profile 建立成功:', profile);
                
                // 保存到 localStorage
                localStorage.setItem('tutorbridge_profile', JSON.stringify(profile));
                
                // 如果是導師，建立空的 tutor_profiles
                if (role === 'tutor') {
                    const tutorProfileData = {
                        user_id: session.user.id,
                        subjects: [],
                        hourly_rate: 0,
                        qualification: '',
                        teaching_experience: '',
                        self_introduction: '',
                        is_paid: false,
                        can_teach_grades: [],
                        avatar_url: null
                    };
                    
                    const { data: tutorProfile, error: tutorError } = await supabase
                        .from('tutor_profiles')
                        .insert([tutorProfileData])
                        .select()
                        .single();
                    
                    if (!tutorError && tutorProfile) {
                        localStorage.setItem('tutorbridge_tutor_profile', JSON.stringify(tutorProfile));
                        console.log('✅ Tutor profile 建立成功');
                    }
                }

                showToast('帳戶建立成功！', 'success');
                
                // 根據角色跳轉
                setTimeout(() => {
                    if (role === 'student') {
                        window.location.href = 'index.html';
                    } else {
                        window.location.href = 'profile.html';
                    }
                }, 1000);

            } catch (error) {
                console.error('❌ 建立帳戶失敗:', error);
                showToast('建立帳戶失敗：' + error.message, 'error');
                loading.style.display = 'none';
                buttons.forEach(btn => btn.disabled = false);
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
