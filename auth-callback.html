<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>處理登入中 — TutorBridgeHK</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="text-align: center; padding: 80px 20px;">
        <h2>⏳ 處理登入中...</h2>
        <p style="color: var(--gray-600);">請稍候</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://aweqbxyjeohsnevnkwor.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1tMcgJ9Gv5vfi-pKrPqOTA_BdhZqPoM';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();

            if (!session) {
                window.location.href = 'auth.html';
                return;
            }

            const user = session.user;

            // 檢查 profiles 表
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .maybeSingle();

            if (profile) {
                // 有 profile，但檢查是否 Google 用戶未完善資料
                const isGoogleUser = profile.role === 'student' && 
                                     !profile.user_code && 
                                     (!profile.phone || profile.phone === '');
                
                if (isGoogleUser) {
                    // 跳轉到個人檔案完善資料
                    window.location.href = 'profile.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                // 冇 profile，跳轉到選擇身份頁面
                window.location.href = 'choose-role.html';
            }
        });
    </script>
</body>
</html>
