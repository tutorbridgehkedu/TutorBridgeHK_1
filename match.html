<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorBridgeHK — 配對列表</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- 一般瀏覽器 -->
    <link rel="icon" type="image/png" sizes="32x32" href="tutorbridgehkicon3.png">
    <link rel="icon" type="image/png" sizes="16x16" href="tutorbridgehkicon3.png">
    <!-- Apple 裝置 -->
    <link rel="apple-touch-icon" sizes="180x180" href="tutorbridgehkicon3.png">
    <!-- Android 裝置 -->
    <link rel="manifest" href="tutorbridgehkicon3.png">
    <!-- 内联脚本：立即设置导航栏状态，防止闪烁 -->
    <script>
        (function() {
            try {
                const storedProfile = localStorage.getItem('tutorbridge_profile');
                if (storedProfile) {
                    const profile = JSON.parse(storedProfile);
                    // 创建临时样式来立即隐藏默认导航栏，显示用户菜单
                    const style = document.createElement('style');
                    style.id = 'nav-state-style';
                    style.textContent = '#authButtons { display: none !important; } #userMenu { display: flex !important; }';
                    document.head.appendChild(style);
                    
                    // 设置问候语的内容，等DOM加载后
                    document.addEventListener('DOMContentLoaded', function() {
                        const userGreeting = document.getElementById('userGreeting');
                        if (userGreeting) {
                            userGreeting.textContent = '你好, ' + (profile.name || '用戶');
                        }
                    });
                }
            } catch(e) {
                console.error('恢复导航栏状态失败:', e);
            }
        })();
    </script>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <img src = "tutorbridgehkicon3.png" alt="思橋 TutorBridgeHK" style="height: 60px; width: auto;">
                    TutorBridgeHK
                </a>
                <nav class="nav-links">
                    <div id="authButtons" style="display:flex; gap:24px; align-items:center;">
                        <a class="nav-link" href="index.html">首頁</a>
                        <a class="btn btn-secondary btn-small" href="auth.html">登入/註冊</a>
                    </div>
                    <div id="userMenu" class="user-menu" style="display:none; gap:24px; align-items:center;">
                        <span class="user-greeting" id="userGreeting"></span>
                        <a class="nav-link" href="index.html">首頁</a>
                        <a class="nav-link" href="match.html">📋 配對列表</a>
                        <a class="nav-link" href="post.html">發布Post</a>
                        <a class="nav-link" href="messages.html">訊息</a>
                        <a class="nav-link" href="profile.html">個人檔案</a>
                        <button class="btn btn-logout btn-small" onclick="logout()">登出</button>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>TutorBridgeHK — 免中介費補習配對平台</h1>
            <p class="hero-subtitle">學生導師 · 免費配對 · 不收中介費</p>
        </div>
    </section>

    <main class="main-content">
        <div class="container">
            <!-- Tabs -->
            <div class="tabs-container">
                <div class="tab active" onclick="switchTab('tutor_wanted')" id="tabTutorWanted">
                    📚 學生個案列表 <span class="tab-count" id="tutorWantedCount">0</span>
                </div>
                <div class="tab" onclick="switchTab('student_wanted')" id="tabStudentWanted">
                    🎓 導師列表 <span class="tab-count" id="studentWantedCount">0</span>
                </div>
            </div>
            
            <div class="search-section">
                <div class="filter-grid">
                    <div class="form-group">
                        <label>科目</label>
                        <select class="form-control" id="filterSubject" onchange="loadPosts()">
                            <option value="">全部</option>
                            <optgroup label="幼稚園">
                                <option value="幼稚園中文">中文</option>
                                <option value="幼稚園英文">英文</option>
                                <option value="幼稚園數學">數學</option>
                            </optgroup>
                            <optgroup label="小學">
                                <option value="小學中文">中文</option>
                                <option value="小學英文">英文</option>
                                <option value="小學數學">數學</option>
                                <option value="小學常識">常識</option>
                            </optgroup>
                            <optgroup label="中學核心科目">
                                <option value="中文">中文</option>
                                <option value="英文">英文</option>
                                <option value="數學">數學</option>
                                <option value="公民與社會發展">公民與社會發展</option>
                            </optgroup>
                            <optgroup label="中學文科">
                                <option value="中國文學">中國文學</option>
                                <option value="英語文學">英語文學</option>
                                <option value="中國歷史">中國歷史</option>
                                <option value="歷史">歷史</option>
                                <option value="地理">地理</option>
                            </optgroup>
                            <optgroup label="中學商科">
                                <option value="經濟">經濟</option>
                                <option value="企業、會計與財務概論">企業、會計與財務概論</option>
                            </optgroup>
                            <optgroup label="中學理科">
                                <option value="生物">生物</option>
                                <option value="化學">化學</option>
                                <option value="物理">物理</option>
                            </optgroup>
                            <optgroup label="中學其他選修">
                                <option value="倫理與宗教">倫理與宗教</option>
                                <option value="旅遊與款待">旅遊與款待</option>
                                <option value="設計與應用科技">設計與應用科技</option>
                                <option value="健康管理與社會關懷">健康管理與社會關懷</option>
                                <option value="資訊及通訊科技">資訊及通訊科技</option>
                                <option value="科技與生活">科技與生活</option>
                            </optgroup>
                            <optgroup label="中學術科">
                                <option value="音樂">音樂</option>
                                <option value="視覺藝術">視覺藝術</option>
                                <option value="體育">體育</option>
                            </optgroup>
                            <optgroup label="其他">
                                <option value="大專">大專</option>
                                <option value="大學">大學</option>
                                <option value="成人">成人</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>上課模式</label>
                        <select class="form-control" id="filterTeachingMode" onchange="loadPosts()">
                            <option value="">全部</option>
                            <option value="面對面授課">面對面授課</option>
                            <option value="視像補習">視像補習</option>
                            <option value="兩者皆可">兩者皆可</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>大區域</label>
                        <select class="form-control" id="filterDistrict" onchange="updateSubDistrictFilter(); loadPosts();">
                            <option value="">全部</option>
                            <option value="香港島">香港島</option>
                            <option value="九龍">九龍</option>
                            <option value="新界">新界</option>
                            <option value="離島">離島</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>詳細地區</label>
                        <select class="form-control" id="filterSubDistrict" onchange="loadPosts()">
                            <option value="">全部</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="postsList" class="posts-grid">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <h3>載入中...</h3>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                © 2024 TutorBridgeHK. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Modals -->
    <div id="deletePostModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">確認刪除</h3>
                <button class="modal-close" onclick="closeModal('deletePostModal')">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 24px;">確定要刪除此 Post 嗎？此動作無法復原。</p>
                <div style="display: flex; gap: 12px;">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeModal('deletePostModal')">取消</button>
                    <button type="button" class="btn btn-danger" style="flex: 1;" onclick="confirmDeletePost()">確認刪除</button>
                </div>
            </div>
        </div>
    </div>

    <div id="reportModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">舉報</h3>
                <button class="modal-close" onclick="closeModal('reportModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="reportForm" onsubmit="handleReport(event)">
                    <div class="form-group">
                        <label>舉報原因</label>
                        <textarea class="form-control" id="reportReason" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-danger" style="width:100%;">提交舉報</button>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadPosts === 'function') {
                loadPosts();
            }
        });
    </script>
</body>
</html>
