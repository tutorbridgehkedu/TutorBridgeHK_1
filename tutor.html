<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorBridgeHK — 導師詳情</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- 一般瀏覽器 -->
    <link rel="icon" type="image/png" sizes="32x32" href="tutorbridgehkicon3.png">
    <link rel="icon" type="image/png" sizes="16x16" href="tutorbridgehkicon3.png">
    <!-- Apple 裝置 -->
    <link rel="apple-touch-icon" sizes="180x180" href="tutorbridgehkicon3.png">
    <!-- Android 裝置 -->
    <link rel="manifest" href="tutorbridgehkicon3.png">
    <!-- 内联脚本：立即设置导航栏状态，防止闪烁 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!localStorage.getItem('tutorbridge_agreed')) {
                window.location.href = 'agree.html';
            }
        });
        (function() {
            try {
                const storedProfile = localStorage.getItem('tutorbridge_profile');
                if (storedProfile) {
                    const profile = JSON.parse(storedProfile);
                    // 创建临时样式来立即隐藏默认导航栏，显示用户菜单
                    const style = document.createElement('style');
                    style.id = 'nav-state-style';
                    style.textContent = '#authButtons { display: none !important; } #userMenu { display: flex !important; }';
                    document.head.appendChild(style);
                    
                    // 设置问候语的内容，等DOM加载后
                    document.addEventListener('DOMContentLoaded', function() {
                        const userGreeting = document.getElementById('userGreeting');
                        if (userGreeting) {
                            userGreeting.textContent = '你好, ' + (profile.name || '用戶');
                        }
                    });
                }
            } catch(e) {
                console.error('恢复导航栏状态失败:', e);
            }
        })();
    </script>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <img src = "tutorbridgehkicon3.png" alt="思橋 TutorBridgeHK" style="height: 60px; width: auto;">
                    TutorBridgeHK
                </a>
                <nav class="nav-links">
                    <div id="authButtons" style="display:flex; gap:24px; align-items:center;">
                        <a class="nav-link" href="index.html">首頁</a>
                        <a class="btn btn-secondary btn-small" href="auth.html">登入/註冊</a>
                    </div>
                    <div id="userMenu" class="user-menu" style="display:none; gap:24px; align-items:center;">
                        <span class="user-greeting" id="userGreeting"></span>
                        <a class="nav-link" href="index.html">首頁</a>
                        <a class="nav-link" href="match.html">📋 配對列表</a>
                        <a class="nav-link" href="post.html">發布Post</a>
                        <a class="nav-link" href="messages.html">訊息</a>
                        <a class="nav-link" href="profile.html">個人檔案</a>
                        <button class="btn btn-logout btn-small" onclick="logout()">登出</button>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>TutorBridgeHK — 免中介費補習配對平台</h1>
            <p class="hero-subtitle">學生導師 · 免費配對 · 不收中介費</p>
        </div>
    </section>

    <main class="main-content">
        <div class="container">
            <button class="btn btn-secondary btn-small" onclick="window.location.href='index.html'">← 返回首頁</button>
            <div id="tutorDetailContent" class="profile-card" style="margin-top:16px;">
                <div class="empty-state">載入中...</div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <a href="terms.html" style="color: #94A3B8; text-decoration: none; font-size: 13px;">服務條款</a>
                    <a href="disclaimer.html" style="color: #94A3B8; text-decoration: none; font-size: 13px;">免責聲明</a>
                    <a href="privacy.html" style="color: #94A3B8; text-decoration: none; font-size: 13px;">私隱政策</a>
                </div>
                <h1></h1>
            </div>
            <div class="footer-bottom">
                © 2026 TutorBridgeHK. All rights reserved.
            </div>
        </div>
    </footer>

    <div class="toast-container" id="toastContainer"></div>

    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 從URL獲取導師ID
            const urlParams = new URLSearchParams(window.location.search);
            const tutorId = urlParams.get('id');
            
            if (tutorId && typeof viewTutor === 'function') {
                // 修改 viewTutor 函数以支持直接從URL獲取ID
                // 臨時覆蓋 selectedTutorId
                window.selectedTutorId = tutorId;
                // 我們需要重載 viewTutor 函數，讓它直接使用這個ID
                const loadTutorDetail = async (userId) => {
                    const content = document.getElementById('tutorDetailContent');
                    if (!content) return;
                    content.innerHTML = '<div class="empty-state">載入中...</div>';
                    
                    try {
                        const { data: tutorData, error: tutorError } = await supabase
                            .from('tutor_profiles')
                            .select(`
                                *,
                                profiles!inner(*)
                            `)
                            .eq('user_id', userId)
                            .single();
                        
                        if (tutorError) throw tutorError;
                        
                        const profile = tutorData.profiles;
                        const initial = profile.name ? profile.name.charAt(0).toUpperCase() : 'T';
                        const subjectsText = (tutorData.subjects || []).join(', ') || '未設定';
                        const locationText = (profile.districts || []).join(', ') || profile.district || '未設定';
                        const gradesText = (tutorData.can_teach_grades || []).join(', ') || '未設定';
                        
                        content.innerHTML = `
                            <div class="profile-header">
                                ${tutorData.avatar_url ? 
                                    `<img src="${tutorData.avatar_url}" class="profile-avatar" alt="${escapeHtml(profile.name)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                     <div class="profile-avatar" style="display:none">${initial}</div>` : 
                                    `<div class="profile-avatar">${initial}</div>`}
                                <div class="profile-info">
                                    <h2>${escapeHtml(profile.name || '導師')}</h2>
                                    <p style="color: var(--primary-color); font-weight: 600; margin-top: 4px;">${escapeHtml(profile.user_code || '未設定')}</p>
                                </div>
                            </div>
                            
                            <div class="profile-details" style="margin-top: 24px;">
                                <div class="detail-item">
                                    <div class="detail-label">可教年級</div>
                                    <div class="detail-value">${escapeHtml(gradesText)}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">可教科目</div>
                                    <div class="detail-value">${escapeHtml(subjectsText)}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">每小時收費</div>
                                    <div class="detail-value">$${tutorData.hourly_rate || 0}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">學歷</div>
                                    <div class="detail-value">${escapeHtml(tutorData.qualification || '未設定')}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">教學經驗</div>
                                    <div class="detail-value">${escapeHtml(tutorData.teaching_experience || '未設定')}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">地區</div>
                                    <div class="detail-value">${escapeHtml(locationText)}</div>
                                </div>
                            </div>
                            
                            <div style="margin-top: 32px; display: flex; gap: 12px;">
                                <button class="btn btn-secondary" onclick="window.location.href='index.html'">← 返回</button>
                                ${currentProfile && currentProfile.role === 'student' ? 
                                    `<button class="btn btn-primary" onclick="contactTutor('${userId}')">聯絡導師</button>` : 
                                    ''}
                            </div>
                        `;
                        
                    } catch (error) {
                        console.error('❌ 載入導師詳情失敗:', error);
                        content.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">⚠️</div>
                                <h3>載入失敗</h3>
                                <p>${error.message}</p>
                            </div>
                        `;
                    }
                };
                loadTutorDetail(tutorId);
            }
        });
    </script>
</body>
</html>
